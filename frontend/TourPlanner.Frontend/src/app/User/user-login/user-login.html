<div class="login-container">
    <div class="login-panel">
        <h2>Login</h2>

        <input type="text" placeholder="Username or Email" (input)="setIdentifier($event.target.value)" />

        <input type="password" placeholder="Password" (input)="setPassword($event.target.value)" />

        <button (click)="onLoginClick()">
            Login
        </button>

        <div class="error">
            @if (errorMessage){
            {{errorMessage}}
            }
        </div>

        <div class="register-link">
            <a routerLink="/register">Register?</a>
        </div>

    </div>
</div>
