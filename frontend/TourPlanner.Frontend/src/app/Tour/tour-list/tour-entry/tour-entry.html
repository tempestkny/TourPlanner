<div class="tour-list-item">

    <div class="tour-list-left">
        <p class="tour-title">{{ tour.name }}</p>
        <p>from: {{ tour.from }}</p>
        <p>to: {{ tour.to }}</p>
        <p>transport: {{ tour.transportType }}</p>

        <div class="tour-actions">
            <button>view details</button>
            <button>delete tour</button>
        </div>
    </div>
    <img class="tour-map" src="assets/a.png" alt="Map placeholder">

</div>
