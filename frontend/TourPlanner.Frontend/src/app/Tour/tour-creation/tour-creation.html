<h3>Add new tour</h3>


<div class="tour-creation-panel">
    <div class="input-details">
        <p>Tour Details</p>
        <input type="text" placeholder="Title" (input)="setTitle($event.target.value)" />
        <input type="text" placeholder="Description" (input)="setDescription($event.target.value)" />

        <input type="text" placeholder="From" (input)="setFrom($event.target.value)" />
        @if (isFromValid){<div class="information">[{{fromCoord?.lat!.toFixed(2)}},{{fromCoord?.lon!.toFixed(2)}}]</div>}
        <input type="text" placeholder="To" (input)="setTo($event.target.value)" />
        @if (isToValid){<div class="information">[{{toCoord?.lat!.toFixed(2)}},{{toCoord?.lon!.toFixed(2)}}]</div>}

        <select #transportSelect (change)="setTransportType(transportSelect.value)">
            <option value="null" disabled selected>Transport Type</option>
            <option value="Car">Car</option>
            <option value="Bike">Bike</option>
            <option value="Hike">Hike</option>
        </select>

        <div class="generate-route">
            <button (click)="setPoints()">Generate Route</button>
        </div>

        @if (validationMessage) {
        <div class="error">{{ validationMessage }}</div>
        }
    </div>

    <div class="map-and-buttons">
        <div class="tour-creation-buttons">
            <button (click)="CreateTour()">Create Tour</button>
            <button (click)="Cancel()">cancel</button>
        </div>
        <app-tour-map-component [tour] = "newTour"></app-tour-map-component>
    </div>

</div>
