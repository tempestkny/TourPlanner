<div class="split-view">
    <div class="left">
        <router-outlet name="list"></router-outlet>
        <app-tour-list 
            (selectTour)="onSelectTour($event)" 
            (createTour)="onCreateTour()" 
            (viewLogList)="onViewLogList($event)"
            (createLog)="onCreateLog($event)"
            >
        </app-tour-list>
    </div>

    <div class="right">
        <!--Event Handling of which page the shell should display on the right side-->
        @switch (mode) {
        @case('detail'){
        <app-tour-detail 
            [tour]="selectedTour"
            (editTour)="onEditTour($event)"/>
        />
        }

        @case('edit'){
        <app-tour-edit 
            [tour]="selectedTour"
            (saved)="onEditSaved($event)"
            (cancel)="onEditCancelled()"
        />
        }

        @case('create'){
        <app-tour-creation 
            (cancel)="onCreateCancelled()"
            (success)="onCreateSuccess($event)"
            />
        }

        @case('logList'){
        <app-tour-log-list 
            [tour]="selectedTour" 
            (viewLog)="onViewLog($event)" 
            />
        }

        @case('logCreate'){
        <app-create-tour-log 
            (cancel)="onCancelLog()" 
            />
        }

        @case('logView'){
        <app-view-tour-log 
            [log]="selectedLog" 
            (back)="onCancelLog()" 
            (editLog)="onEditLog($event)" 
            (deleteLog)="onDeleteLog($event)"
            />
        }

        @case('logEdit'){
         <app-edit-tour-log 
            [log]="selectedLog" 
            (back)="onCancelLog()" 
            (save)="onSaveLog($event)"/>   
        }

        @default {
        <div class="placeholder">
            add or select a tour
        </div>
        }
    }
    </div>

</div>
