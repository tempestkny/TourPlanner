<div class="split-view">
    <div class="left">
        <router-outlet name="list"></router-outlet>
        <app-tour-list 
            (selectTour)="onSelectTour($event)" 
            (createTour)="onCreateTour()" 
            (editTour)="onEditTour($event)"
            (viewLogs)="onViewLogs($event)"
            (createLog)="onCreateLog($event)">
        </app-tour-list>
    </div>

    <div class="right">
        <!--Event Handling of which page the shell should display on the right side-->
        @switch (mode) {
        @case('detail'){
        <app-tour-detail [tour]="selectedTour"></app-tour-detail>
        }
        @case('edit'){
        <app-tour-edit [tour]="selectedTour"></app-tour-edit>
        }
        @case('create'){
        <app-tour-creation/>
        }

        @case('logList'){
        <app-tour-log-list [tour]="selectedTour" />
        }
        @case('logCreate'){
        <app-create-tour-log/>
        }

        @default {
        <div class="placeholder">Select or create a tour</div>
        }
        }
    </div>

</div>
