<div class="split-view">
    <div class="left">
        <router-outlet name="list"></router-outlet>
        <app-tour-list 
            (selectTour)="onSelectTour($event)" 
            (createTour)="onCreateTour()" 
            (editTour)="onEditTour($event)"
            (viewLogList)="onViewLogList($event)"
            (createLog)="onCreateLog($event)"
            >
        </app-tour-list>
    </div>

    <div class="right">
        <!--Event Handling of which page the shell should display on the right side-->
        @switch (mode) {
        @case('detail'){
        <app-tour-detail [tour]="selectedTour"/>
        }

        @case('edit'){
        <app-tour-edit [tour]="selectedTour"/>
        }

        @case('create'){
        <app-tour-creation/>
        }

        @case('logList'){
        <app-tour-log-list 
        [tour]="selectedTour" 
        (viewLog)="onViewLog($event)"
        />
        }

        @case('logCreate'){
        <app-create-tour-log
        (cancel)="onCancelLog()"
        />
        }

        @case('logView'){
            <app-view-tour-log
            [log]="selectedLog"
            />

        }

        @default {
        <div class="placeholder"></div>
        }
        }
    </div>

</div>
